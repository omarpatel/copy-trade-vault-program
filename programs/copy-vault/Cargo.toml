[package]
name = "copy-vault"
version = "0.1.0"
description = "copy-vault: pump.fun coins whose creator fees fund an on-chain vault that copy-trades a target wallet"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "copy_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
anchor-spl = { version = "0.31.1", default-features = false, features = ["token", "token_2022", "associated_token"] }
